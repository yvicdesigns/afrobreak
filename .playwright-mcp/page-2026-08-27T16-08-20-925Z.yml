                    - paragraph [ref=f3e391]: A unique and historic honour presented not as a competitive award but as a formal act of recognition and gratitude. The Great 8 acknowledges eight key personalities — B-Boys, B-Girls, organisers, educators, promoters or cultural leaders — whose vision, sacrifice and dedication were foundational to the establishment and growth of Breaking and HipHop culture on the African continent and in the global arena. The Great 8 are not nominees — they are legends, and this honour exists to ensure that the architects of African street dance culture are never forgotten.
